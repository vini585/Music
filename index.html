<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060c">
<title>Orbita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5 19.5 12 7 19.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4" height="15" rx="1.2"/><rect x="14" y="4.5" width="4" height="15" rx="1.2"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><rect x="5" y="5" width="2.2" height="14" rx="1"/><path d="M19 5.5v13L8.8 12z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><rect x="16.8" y="5" width="2.2" height="14" rx="1"/><path d="M5 5.5v13L15.2 12z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 7h3.5c5 0 5 10 10 10H21M3 17h3.5c1.8 0 3-1 4-2.2M13 8.6C14 7.5 15.1 7 16.5 7H21M18.5 4.5 21 7l-2.5 2.5M18.5 14.5 21 17l-2.5 2.5"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v6M14 11v6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V6l11-2v12M9 18a3 3 0 1 1-3-3 3 3 0 0 1 3 3zM20 16a3 3 0 1 1-3-3 3 3 0 0 1 3 3z"/></symbol>
    <symbol id="i-film" viewBox="0 0 24 24"><path d="M3.5 5h17v14h-17zM8 5v14M16 5v14M3.5 10H8M3.5 14H8M16 10h4.5M16 14h4.5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-8"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 6h16M4 12h9M4 18h7M16 14v6l5-3z"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
    <symbol id="i-logo" viewBox="0 0 32 32"><ellipse cx="16" cy="16" rx="13" ry="5.5" transform="rotate(-28 16 16)" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="16" r="4.2" fill="currentColor"/><circle cx="26" cy="10.2" r="2" fill="var(--accent2)"/></symbol>
  </defs>
</svg>

<div id="app">
  <header class="top">
    <div class="brand"><svg class="ic" style="width:26px;height:26px"><use href="#i-logo"/></svg><span>ORBITA</span></div>
    <button class="ib" id="theme" aria-label="Alternar tema claro e escuro"><svg class="ic s" id="theme-ic"><use href="#i-sun"/></svg></button>
  </header>

  <main id="view"></main>

  <div id="mini" class="mini" hidden>
    <button class="mini-open" data-act="np-open" aria-label="Abrir player">
      <span class="cov" id="mini-cov"><svg class="ic s"><use href="#i-music"/></svg></span>
      <span class="meta"><span class="t" id="mini-title"></span><span class="a" id="mini-artist"></span></span>
    </button>
    <button class="ib" data-act="mini-play" id="mini-play" aria-label="Tocar ou pausar"><svg class="ic" id="mini-play-ic"><use href="#i-play"/></svg></button>
    <button class="ib" data-act="next" aria-label="Próxima"><svg class="ic"><use href="#i-next"/></svg></button>
    <i class="mini-bar" id="mini-bar"></i>
  </div>

  <nav class="tabs" aria-label="Seções">
    <button class="tab" data-tab="library"><svg class="ic s"><use href="#i-music"/></svg><span>Biblioteca</span></button>
    <button class="tab" data-tab="search"><svg class="ic s"><use href="#i-download"/></svg><span>Baixar</span></button>
    <button class="tab" data-tab="playlists"><svg class="ic s"><use href="#i-list"/></svg><span>Playlists</span></button>
    <button class="tab" data-tab="stats"><svg class="ic s"><use href="#i-chart"/></svg><span>Estatísticas</span></button>
  </nav>
</div>

<section id="np" class="np" aria-hidden="true">
  <div class="np-top">
    <button class="ib" data-act="np-close" aria-label="Fechar player"><svg class="ic s"><use href="#i-down"/></svg></button>
    <span>Tocando agora</span>
    <button class="ib" data-act="np-pl" aria-label="Adicionar à playlist"><svg class="ic s"><use href="#i-list"/></svg></button>
  </div>
  <div class="frame" id="frame" data-kind="audio">
    <canvas id="viz"></canvas>
    <video id="media" playsinline preload="metadata"></video>
  </div>
  <div class="np-info">
    <div class="np-txt"><h2 id="np-title">Nada tocando</h2><p id="np-artist">Escolha uma faixa</p></div>
    <button class="ib" id="np-fav" data-act="np-fav" aria-pressed="false" aria-label="Favoritar"><svg class="ic s"><use href="#i-heart"/></svg></button>
  </div>
  <div class="seekrow">
    <span class="mono" id="np-tcur">0:00</span>
    <input type="range" id="np-seek" min="0" max="1000" value="0" aria-label="Posição da faixa">
    <span class="mono" id="np-tdur">0:00</span>
  </div>
  <div class="ctrls">
    <button class="ib" id="np-shuffle" data-act="shuffle" aria-pressed="false" aria-label="Ordem aleatória"><svg class="ic s"><use href="#i-shuffle"/></svg></button>
    <button class="ib" data-act="prev" aria-label="Anterior"><svg class="ic"><use href="#i-prev"/></svg></button>
    <button class="play" id="np-play" data-act="toggle" aria-label="Tocar"><svg class="ic" id="np-play-ic"><use href="#i-play"/></svg></button>
    <button class="ib" data-act="next" aria-label="Próxima"><svg class="ic"><use href="#i-next"/></svg></button>
    <button class="ib" id="np-repeat" data-act="repeat" data-mode="off" aria-pressed="false" aria-label="Repetir"><svg class="ic s"><use href="#i-repeat"/></svg><span class="one">1</span></button>
  </div>
  <div class="np-extra"><button class="chip" id="np-speed" data-act="speed">1x</button></div>
</section>

<div id="sheet" class="sheet" aria-hidden="true">
  <div class="sheet-panel" role="dialog" aria-modal="true">
    <div class="sheet-grab"></div>
    <h3 id="sheet-title"></h3>
    <div id="sheet-body"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="file" multiple accept="audio/*,video/*,.mp3,.m4a,.aac,.wav,.ogg,.opus,.flac,.mp4,.m4v,.mov,.webm,.mkv" hidden>

<script type="module" src="js/app.js"></script>
</body>
</html>
